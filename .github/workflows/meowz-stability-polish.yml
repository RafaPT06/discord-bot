name: Meowz bot stability polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meowz-stability-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stability and wording fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              p.write_text(text.replace(old, new))

          # Fail closed when Railway/production is missing the shared API token.
          replace_required(
              'src/index.js',
              'const databaseUrl = process.env.DATABASE_URL;\n\nif (!token)',
              'const databaseUrl = process.env.DATABASE_URL;\nconst botApiToken = process.env.BOT_API_TOKEN;\nconst hostedProduction = String(process.env.NODE_ENV || "").toLowerCase() === "production"\n  || Boolean(process.env.RAILWAY_PROJECT_ID || process.env.RAILWAY_ENVIRONMENT_ID || process.env.RAILWAY_SERVICE_ID);\n\nif (!token)',
              'production API token declaration',
          )
          replace_required(
              'src/index.js',
              'if (!databaseUrl) throw new Error("Missing DATABASE_URL");',
              'if (!databaseUrl) throw new Error("Missing DATABASE_URL");\nif (hostedProduction && !botApiToken) throw new Error("Missing BOT_API_TOKEN. The bot API cannot start unauthenticated in production.");',
              'production API token validation',
          )

          # Welcome/goodbye delivery and logging should fail independently.
          replace_required(
              'src/index.js',
              '''client.on(Events.GuildMemberAdd, async (member) => {\n  try {\n    await handleMemberJoin(member);\n    await handleLoggedMemberJoin(member);\n  } catch (err) {\n    console.error("Welcome message error:", err);\n  }\n});\n\nclient.on(Events.GuildMemberRemove, async (member) => {\n  try {\n    await handleMemberLeave(member);\n    await handleLoggedMemberLeave(member);\n  } catch (err) {\n    console.error("Goodbye message error:", err);\n  }\n});\n''',
              '''client.on(Events.GuildMemberAdd, async (member) => {\n  const [welcomeResult, logResult] = await Promise.allSettled([\n    handleMemberJoin(member),\n    handleLoggedMemberJoin(member),\n  ]);\n  if (welcomeResult.status === "rejected") console.error("Welcome message error:", welcomeResult.reason);\n  if (logResult.status === "rejected") console.error("Member join log error:", logResult.reason);\n});\n\nclient.on(Events.GuildMemberRemove, async (member) => {\n  const [goodbyeResult, logResult] = await Promise.allSettled([\n    handleMemberLeave(member),\n    handleLoggedMemberLeave(member),\n  ]);\n  if (goodbyeResult.status === "rejected") console.error("Goodbye message error:", goodbyeResult.reason);\n  if (logResult.status === "rejected") console.error("Member leave log error:", logResult.reason);\n});\n''',
              'independent member event handling',
          )

          # Stable generated backgrounds keep previews and real event cards consistent.
          card_base = Path('src/utils/cards/cardBase.js')
          text = card_base.read_text()
          if 'function hashSeed(value)' not in text:
              marker = '\nfunction drawDefaultBackground(ctx, accent, width = WIDTH, height = HEIGHT) {'
              helpers = '''\nfunction hashSeed(value) {\n  const text = String(value ?? "");\n  let hash = 2166136261;\n  for (let i = 0; i < text.length; i += 1) {\n    hash ^= text.charCodeAt(i);\n    hash = Math.imul(hash, 16777619);\n  }\n  return hash >>> 0;\n}\n\nfunction seededRandom(seed) {\n  let state = seed >>> 0 || 0x9e3779b9;\n  return () => {\n    state += 0x6d2b79f5;\n    let value = state;\n    value = Math.imul(value ^ (value >>> 15), value | 1);\n    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);\n    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;\n  };\n}\n'''
              if marker not in text:
                  raise SystemExit('Missing drawDefaultBackground marker')
              text = text.replace(marker, helpers + '\nfunction drawDefaultBackground(ctx, accent, width = WIDTH, height = HEIGHT, seed = null) {')
              text = text.replace(
                  '  ctx.globalAlpha = 0.16;\n\n  for (let i = 0; i < 26; i += 1) {',
                  '  ctx.globalAlpha = 0.16;\n  const random = seed === null || seed === undefined || seed === ""\n    ? Math.random\n    : seededRandom(hashSeed(seed));\n\n  for (let i = 0; i < 26; i += 1) {',
              )
              text = text.replace(
                  '      Math.random() * width,\n      Math.random() * height,\n      60 + Math.random() * 150,',
                  '      random() * width,\n      random() * height,\n      60 + random() * 150,',
              )
              card_base.write_text(text)

          # Compact profile card spacing and consistent member label.
          card = Path('src/utils/cards/memberEventCard.js')
          text = card.read_text()
          text = text.replace(
              '    memberText: memberNumber\n      ? (isGoodbye ? `MEMBER #${memberNumber}` : `YOU ARE MEMBER #${memberNumber}`)\n      : (isGoodbye ? "THANKS FOR BEING HERE" : "WELCOME TO THE SERVER"),',
              '    memberText: memberNumber\n      ? `MEMBER #${memberNumber}`\n      : (isGoodbye ? "THANKS FOR BEING HERE" : "WELCOME TO THE SERVER"),',
          )
          text = text.replace('  const height = 650;', '  const height = 560;')
          if 'const backgroundSeed =' not in text:
              text = text.replace(
                  '  const canvas = createCanvas(width, height);',
                  '  const backgroundSeed = `${type}:${nameText}:${memberNumber || 0}:${accent}`;\n  const canvas = createCanvas(width, height);',
              )
          text = text.replace('drawDefaultBackground(ctx, accent, width, height);', 'drawDefaultBackground(ctx, accent, width, height, backgroundSeed);')
          text = text.replace('  roundRect(ctx, 54, 54, width - 108, height - 108, 30);', '  roundRect(ctx, 54, 44, width - 108, height - 88, 30);')
          text = text.replace('  const avatarSize = showAvatar === false ? 0 : 200;', '  const avatarSize = showAvatar === false ? 0 : 178;')
          text = text.replace('    const avatarY = 128;', '    const avatarY = 82;')
          text = text.replace(
              '  const nameY = showAvatar === false ? 300 : 410;\n  drawCenteredText(ctx, nameText, width / 2, nameY, 850, 66, { minSize: 30, weight: 800 });',
              '  const nameY = showAvatar === false ? 255 : 330;\n  drawCenteredText(ctx, nameText, width / 2, nameY, 900, 72, { minSize: 32, weight: 800 });',
          )
          text = text.replace(
              '    drawCenteredText(ctx, memberText, width / 2, nameY + 66, 760, 28, {\n      minSize: 20,',
              '    drawCenteredText(ctx, memberText, width / 2, nameY + 62, 820, 30, {\n      minSize: 21,',
          )
          card.write_text(text)

          # Standardize American English wording everywhere in the bot repository.
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.js', '.json', '.md', '.html', '.css', '.toml'}:
                  continue
              text = path.read_text(errors='ignore')
              updated = text.replace('levelled', 'leveled').replace('Levelled', 'Leveled')
              if updated != text:
                  path.write_text(updated)
          PY

      - name: Validate JavaScript
        run: |
          node --check src/index.js
          node --check src/services/leveling.js
          node --check src/commands/simulate_level_up.js
          node --check src/services/dashboardSimulations.js
          node --check src/utils/cards/cardBase.js
          node --check src/utils/cards/memberEventCard.js
          if grep -Rni --exclude-dir=.git --exclude='meowz-stability-polish.yml' 'levelled' .; then
            echo 'British spelling still exists in tracked source.'
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name "Meowz Automation"
          git config user.email "actions@github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Polish bot stability and level-up wording"
          git push
